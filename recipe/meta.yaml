{% set name = "xroms" %}
{% set version = "0.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/xroms-{{ version }}.tar.gz
  sha256: 4e9c0ec2a5c35135682a2d132c99038864cadc583ae3942952354bcc4e06d81f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - setuptools-scm >=3.4
    - pip
  run:
    - python >={{ python_min }}
    - cf_xarray
    - dask-core
    - netcdf4
    - numba >=0.49
    - numpy
    - pooch
    - xarray
    - xgcm >=0.8.1

test:
  imports:
    - xroms
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/xoceanmodel/xroms
  summary: Package for working with ROMS output in xarray
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kthyng
